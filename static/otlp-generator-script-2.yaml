apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-generator-script-2
  namespace: monitoring
data:
  send_metric.py: |
    #!/usr/bin/env python3
    import requests
    import time
    import json
    import random
    import uuid
    import argparse

    HOSTS = [
        'api.dlocal.com', 'sandbox-cert.dlocal.com', 'api-certs.dlocal.com',
        'amazon.dlocal.com', 'microsoft.dlocal.com', 'microsoft-sandbox.dlocal.com',
        'apple.dlocal.com', 'apple-sandbox.dlocal.com'
    ]

    URIS = [
        '/', '/api_curl', '/cards', '/checkout', '/currency-exchanges',
        '/customers', '/gmf', '/gmf-apm', '/https%3a/pay.dlocal.com/',
        '/installments-plans', '/ipn', '/login', '/orders', '/payments',
        '/payments-methods', '/payouts', '/refunds', '/sandbox-tools',
        '/secure_cards', '/secure_payments', '/threeds', '/webhook',
        '/webhook-accounts'
    ]

    STATUSES = ['200', '201', '204', '301', '302', '304', '307', '308',
                '400', '401', '403', '404', '405', '408', '431',
                '500', '502', '503', '504']

    METHODS = ['GET', 'POST', 'PUT']
    GEOIPS = ['Uruguay', 'Brazil', 'Argentina', 'United States', 'Germany']

    def generate_payload(merchantid=None, dropped=False):
        host = random.choice(HOSTS)
        method = random.choice(METHODS)
        status = random.choice(STATUSES)
        reason = "blocked" if status.startswith('4') or status.startswith('5') else "ok"
        uri = random.choice(URIS)
        mid = merchantid or str(uuid.uuid4())
        metric_name = "wafmetrics_dropped" if dropped else "wafmetrics"
        
        payload = {
            "resourceMetrics": [{
                "resource": {
                    "attributes": [
                        {"key": "host", "value": {"stringValue": host}},
                        {"key": "merchantid", "value": {"stringValue": mid}},
                        {"key": "geoip_city_country_name", "value": {"stringValue": random.choice(GEOIPS)}},
                        {"key": "method", "value": {"stringValue": method}},
                        {"key": "uri", "value": {"stringValue": uri}},
                        {"key": "status", "value": {"stringValue": status}},
                        {"key": "reason", "value": {"stringValue": reason}},
                    ]
                },
                "scopeMetrics": [{
                    "metrics": [{
                        "name": metric_name,
                        "type": "gauge",
                        "gauge": {
                            "dataPoints": [{
                                "asDouble": 1.0,
                                "timeUnixNano": str(int(time.time() * 1e9))
                            }]
                        }
                    }]
                }]
            }]
        }
        return payload

    def main():
        parser = argparse.ArgumentParser()
        parser.add_argument("--endpoint", default="http://wafmetrics-collector.monitoring:4318/v1/metrics")
        parser.add_argument("--count", type=int, default=10)
        parser.add_argument("--interval", type=float, default=1.0)
        parser.add_argument("--merchantid")
        args = parser.parse_args()
        
        for i in range(args.count):
            dropped = random.random() < 0.2
            payload = generate_payload(args.merchantid, dropped)
            response = requests.post(args.endpoint, headers={"Content-Type": "application/json"}, data=json.dumps(payload))
            print(f"[{i+1}/{args.count}] Sent ({'dropped' if dropped else 'valid'}) -> Status: {response.status_code}")
            time.sleep(args.interval)

    if __name__ == "__main__":
        main()
